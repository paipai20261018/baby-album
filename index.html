<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝宝成长相册</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffb6c1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="宝宝相册">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#fdf6f0; --card:#ffffff; --primary:#ff8fab; --primary-dark:#f76a8c;
    --text:#5b4a4a; --muted:#a89696; --accent:#ffd166; --shadow:0 4px 16px rgba(247,106,140,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  header{background:linear-gradient(135deg,#ffb6c1,#ffd166);padding:24px 16px;text-align:center;color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.15);position:sticky;top:0;z-index:10;box-shadow:var(--shadow)}
  header h1{font-size:1.6rem;letter-spacing:2px}
  header p{font-size:.85rem;opacity:.9;margin-top:4px}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;gap:2px;
    background:#fff;border-top:1px solid #f3e0e4;padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 12px rgba(247,106,140,.10)}
  nav button{flex:1;border:none;background:transparent;color:var(--muted);padding:6px 2px;border-radius:12px;
    cursor:pointer;font-size:.72rem;transition:.2s;display:flex;flex-direction:column;align-items:center;gap:2px}
  nav button span.ic{font-size:1.25rem;line-height:1}
  nav button.active{background:#fff0f3;color:var(--primary-dark)}
  main{max-width:960px;margin:0 auto;padding:16px 16px 86px}
  .card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
  .hidden{display:none!important}
  h2{font-size:1.15rem;margin-bottom:12px;color:var(--primary-dark)}
  label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
  input,textarea,select{width:100%;border:1px solid #f0dede;border-radius:10px;padding:10px;font-size:.95rem;
    font-family:inherit;color:var(--text);background:#fffdfc}
  input:focus,textarea:focus{outline:2px solid var(--primary);border-color:transparent}
  .btn{display:inline-block;border:none;border-radius:12px;padding:11px 22px;font-size:1rem;cursor:pointer;transition:.2s}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-dark)}
  .btn-ghost{background:#fff;color:var(--primary-dark);border:1px solid var(--primary)}
  .btn-danger{background:#ffe5e5;color:#c0392b}
  .drop{border:2px dashed var(--primary);border-radius:14px;padding:28px;text-align:center;color:var(--muted);
    cursor:pointer;transition:.2s;background:#fffafa}
  .drop:hover,.drop.over{background:#fff0f3}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:12px}
  .thumbs div{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1}
  .thumbs img{width:100%;height:100%;object-fit:cover}
  .thumbs button{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.5);color:#fff;border:none;
    border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:12px;line-height:1}
  .timeline{position:relative;padding-left:20px}
  .timeline::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:3px;background:#ffd6de;border-radius:2px}
  .titem{position:relative;margin-bottom:20px}
  .titem::before{content:"";position:absolute;left:-21px;top:18px;width:13px;height:13px;border-radius:50%;
    background:var(--primary);border:3px solid #fff;box-shadow:0 0 0 2px var(--primary)}
  .titem .photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
  .titem .photos img{width:100%;border-radius:10px;cursor:zoom-in;aspect-ratio:1;object-fit:cover;transition:.2s}
  .titem .photos video{width:100%;border-radius:10px;aspect-ratio:1;object-fit:cover;background:#000}
  .titem .photos img:hover{transform:scale(1.03)}
  .thumbs div video{width:100%;height:100%;object-fit:cover;background:#000}
  .vbadge{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.6);color:#fff;
    font-size:10px;padding:1px 6px;border-radius:999px;pointer-events:none}
  /* 媒体单元格控制 */
  .mcell{position:relative}
  .mcell .idx{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.55);color:#fff;
    font-size:10px;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;z-index:2}
  .mctrl{position:absolute;bottom:4px;left:4px;right:4px;display:flex;gap:3px;justify-content:center;z-index:3}
  .mctrl button{background:rgba(255,255,255,.92);border:none;border-radius:6px;color:#f76a8c;
    font-size:11px;padding:3px 0;flex:1;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .mctrl button:hover{background:#fff}
  .datebtns{display:inline-flex;gap:6px;float:right}
  .edit-btn{padding:4px 10px;font-size:.75rem;background:#fff;border:1px solid #ff8fab;color:#f76a8c;border-radius:8px}
  .rowmove{display:inline-flex;gap:6px;margin-left:8px}
  .rowmove button{border:none;background:#fff0f3;color:#f76a8c;border-radius:8px;
    padding:3px 8px;font-size:.72rem;cursor:pointer}
  .rowmove button:disabled{opacity:.35;cursor:not-allowed}
  .titem.editing{outline:2px dashed #ff8fab;outline-offset:6px;border-radius:8px}
  .notice{background:#fff8e1;color:#8a6d00;font-size:.85rem;padding:10px;border-radius:10px;margin-bottom:12px}
  /* 编辑弹窗 */
  #editor{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;
    align-items:flex-end;justify-content:center}
  #editor .panel{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
    border-radius:20px 20px 0 0;padding:20px 18px 26px;animation:slideUp .22s ease}
  @keyframes slideUp{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  #editor h3{color:var(--primary-dark);margin-bottom:6px;font-size:1.1rem}
  .ed-media{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:8px}
  .ed-media .em{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#f5f5f5}
  .ed-media img,.ed-media video{width:100%;height:100%;object-fit:cover}
  .ed-media .em button{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.55);color:#fff;
    border:none;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;line-height:1}
  .ed-media .em .mv{position:absolute;bottom:3px;display:flex;gap:3px;left:3px;right:3px}
  .ed-media .em .mv button{position:static;flex:1;border-radius:5px;width:auto;height:18px;
    background:rgba(255,255,255,.9);color:#f76a8c;font-size:10px}
  #viewer video{max-width:92vw;max-height:88vh;border-radius:8px}
  .date{font-size:.8rem;color:var(--muted);margin-bottom:4px}
  .tag{display:inline-block;background:#fff0f3;color:var(--primary-dark);font-size:.75rem;
    padding:2px 10px;border-radius:999px;margin-left:6px}
  .age-badge{display:inline-block;background:var(--accent);color:#7a5c00;font-size:.75rem;
    padding:2px 10px;border-radius:999px;margin-left:6px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
  .stat{background:#fff;border-radius:14px;padding:14px;text-align:center;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:1.3rem;color:var(--primary-dark)}
  .stat span{font-size:.78rem;color:var(--muted)}
  #viewer{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;
    z-index:100;cursor:zoom-out}
  #viewer img{max-width:92vw;max-height:88vh;border-radius:8px}
  .empty{text-align:center;color:var(--muted);padding:50px 0}
  .empty .emoji{font-size:3rem;display:block;margin-bottom:10px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row>div{flex:1;min-width:140px}
  .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  footer{text-align:center;color:var(--muted);font-size:.78rem;padding:20px 10px 30px}
  .record{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px dashed #f5e3e6;font-size:.92rem}
  .record b{color:var(--primary-dark)}
  @media(max-width:600px){header h1{font-size:1.25rem}}
</style>
</head>
<body>
<header>
  <h1>👶 宝宝成长相册</h1>
  <p id="headerSub">所有数据仅保存在本设备浏览器中，安全私密</p>
</header>
<nav>
  <button class="active" data-tab="home"><span class="ic">🏠</span>首页</button>
  <button data-tab="add"><span class="ic">➕</span>添加</button>
  <button data-tab="timeline"><span class="ic">📷</span>时间轴</button>

<main>
  <!-- 首页 -->

    <div class="card" id="babyCard" style="text-align:center">
      <div style="font-size:4rem" id="babyEmoji">🍼</div>

      <p id="babyAge" style="color:var(--muted);margin-top:6px">去「设置」填写宝宝信息吧</p>
    </div>
    <div class="stats" id="stats"></div>
    <div class="card">
      <h2>最近记录</h2>
      <div id="recentList"></div>
    </div>
  </section>

  <!-- 添加记录 -->
  <section id="tab-add" class="hidden">
    <div class="card">
      <h2>添加成长记录</h2>
      <label>标题 *</label>
      <input id="fTitle" placeholder="例如：第一次翻身 / 百日照">
      <label>日期 *</label>
      <input id="fDate" type="date">
      <label>分类</label>
      <select id="fTag">
        <option>📷 照片</option><option>🎉 里程碑</option><option>🏥 健康</option>
        <option>🎈 有趣瞬间</option><option>🎂 节日生日</option><option>✏️ 其他</option>
      </select>
      <label>描述</label>
      <textarea id="fDesc" rows="3" placeholder="记录下这一刻的故事…"></textarea>
      <label>照片 / 视频（可多选）</label>
      <div class="drop" id="drop">点击选择照片或视频，也可以拖到这里 📷🎬</div>
      <input type="file" id="fPhotos" accept="image/*,video/*" multiple hidden>
      <div class="thumbs" id="thumbs"></div>
      <div class="actions">
        <button class="btn btn-primary" id="btnSave">💾 保存记录</button>
        <button class="btn btn-ghost" id="btnReset">清空</button>

    </div>
    <div class="card">
      <h2>🍼 吸母乳记录</h2>

        <div><label>时间</label><input id="fFeedTime" type="datetime-local"></div>

      </div>
      <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">

        <button class="btn btn-ghost" style="padding:5px 12px;font-size:.82rem" data-quickml="60">60ml</button>
        <button class="btn btn-ghost" style="padding:5px 12px;font-size:.82rem" data-quickml="90">90ml</button>
        <button class="btn btn-ghost" style="padding:5px 12px;font-size:.82rem" data-quickml="120">120ml</button>
        <button class="btn btn-ghost" style="padding:5px 12px;font-size:.82rem" data-quickml="150">150ml</button>
        <button class="btn btn-ghost" style="padding:5px 12px;font-size:.82rem" id="btnNow">此刻</button>
      </div>
      <div class="actions"><button class="btn btn-primary" id="btnFeed">💾 保存吸乳记录</button></div>
      <div id="feedRecent" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <h2>快速记录身高体重</h2>

        <div><label>日期</label><input id="gDate" type="date"></div>

  <!-- 时间轴 -->

        <div><label>筛选分类</label><select id="filterTag"><option value="">全部</option></select></div>

    <div class="card">

      <label>小名 / 姓名</label><input id="sName" placeholder="宝宝的小名">
      <label>生日</label><input id="sBirth" type="date">

        <option>👶</option><option>👦</option><option>👧</option><option>🍼</option>

<footer>数据仅存储在本设备浏览器（IndexedDB）中 · 可通过「设置 → 安装为应用」添加到主屏幕 · 清除浏览器数据前请先导出备份 💝</footer>
<div id="viewer" class="hidden"><img id="viewerImg" alt=""><video id="viewerVid" controls playsinline class="hidden"></video></div>

<div id="editor" class="hidden">
  <div class="panel">
    <h3>✏️ 编辑记录</h3>

      <button class="btn btn-ghost" id="eAddBtn" style="padding:8px 16px;font-size:.9rem">＋ 添加媒体</button>

    </div>
    <div class="actions" style="margin-top:16px">
      <button class="btn btn-primary" id="eSave" style="flex:1">💾 保存修改</button>
      <button class="btn btn-ghost" id="eCancel">取消</button>
    </div>
  </div>
</div>

<script>
/* ================= IndexedDB ================= */
const DB_NAME='babyAlbum', DB_VER=2;
let db;
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=e=>{
    const d=e.target.result;
    if(!d.objectStoreNames.contains('entries'))d.createObjectStore('entries',{keyPath:'id'});
    if(!d.objectStoreNames.contains('growth'))d.createObjectStore('growth',{keyPath:'id'});
    if(!d.objectStoreNames.contains('feeds'))d.createObjectStore('feeds',{keyPath:'id'});
    if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'});
  };
  r.onsuccess=e=>{db=e.target.result;res(db)};
  r.onerror=()=>rej(r.error);
});}
function tx(store,mode,fn){return new Promise((res,rej)=>{
  const t=db.transaction(store,mode),s=t.objectStore(store),rq=fn(s);
  t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error);
});}
const dbAll=s=>tx(s,'readonly',o=>o.getAll());
const dbPut=(s,v)=>tx(s,'readwrite',o=>o.put(v));
const dbDel=(s,k)=>tx(s,'readwrite',o=>o.delete(k));
const dbClear=s=>tx(s,'readwrite',o=>o.clear());

/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
const uid=()=>Date.now()+''+Math.random().toString(36).slice(2,7);
const fmtDate=d=>{const x=new Date(d+'T00:00:00');return `${x.getFullYear()}年${x.getMonth()+1}月${x.getDate()}日`};
function calcAge(birth,date){
  if(!birth)return '';
  const b=new Date(birth+'T00:00:00'),d=new Date(date+'T00:00:00');
  let days=Math.floor((d-b)/864e5); if(days<0)return '';
  const y=Math.floor(days/365),m=Math.floor((days%365)/30),dd=days%30;
  if(days<31)return days+'天';
  if(y<1)return (m||1)+'个月'+(dd?dd+'天':'');
  return y+'岁'+m+'个月';
}
/* 图片压缩后转 blob 存储 */
function compress(file,maxSide=1600,quality=.85){
  return new Promise(res=>{
    const img=new Image(),url=URL.createObjectURL(file);
    let done=false;
    const finish=b=>{if(done)return;done=true;URL.revokeObjectURL(url);res(b||file)};
    img.onload=()=>{
      try{
        let{width:w,height:h}=img;
        if(!w||!h){finish(file);return}
        const sc=Math.min(1,maxSide/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        c.toBlob(b=>finish(b),'image/jpeg',quality);
      }catch(err){finish(file)}
    };
    img.onerror=()=>finish(file);
    img.src=url;
    setTimeout(()=>finish(file),15000);
  });
}
/* 视频大小校验：超过 80MB 跳过（IndexedDB 存大文件易失败） */
const VIDEO_MAX=80*1024*1024;
/* 本地日期字符串（避免 toISOString 的 UTC 时区偏移） */
function localDateStr(d=new Date()){
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

/* ================= 状态 ================= */
let baby=JSON.parse(localStorage.getItem('baby')||'null');
let pendingPhotos=[]; // {name, blob}
let entries=[], growthData=[], feeds=[];

/* ================= 渲染 ================= */
function renderHome(){
  if(baby){
    $('#babyEmoji').textContent=baby.emoji||'👶';
    $('#babyName').textContent=baby.name||'我家宝宝';
    const today=localDateStr();
    $('#babyAge').textContent=baby.birth?`🎂 ${fmtDate(baby.birth)} · 已经 ${calcAge(baby.birth,today)}`:'生日未设置';
  }
  const nPhotos=entries.reduce((a,e)=>a+(e.photos||[]).length,0);
  const nVideos=entries.reduce((a,e)=>a+(e.videos||[]).length,0);
  const today=localDateStr();

    items.push({ts:g.date,day:g.date,label:`📏 身高体重 · ${parts||'—'}`,
      age:calcAge(baby&&baby.birth,g.date)});

  [...feeds].sort((a,b)=>b.ts.localeCompare(a.ts)).forEach(f=>{
    items.push({ts:f.ts,day:(f.ts||'').slice(0,10),label:`🍼 吸母乳 · ${f.ml}ml`,
      time:(f.ts||'').slice(11,16),age:calcAge(baby&&baby.birth,(f.ts||'').slice(0,10))});
  });

/* 统一取出一条记录的有序媒体列表 [{type:'image'|'video', blob}] */
function getMedia(entry){
  if(Array.isArray(entry.media)&&entry.media.length&&entry.media[0]&&entry.media[0].blob!==undefined)
    return entry.media;
  // 兼容旧数据：photos / videos 分开存
  const out=[];
  (entry.photos||[]).forEach(b=>out.push({type:'image',blob:b}));
  (entry.videos||[]).forEach(b=>out.push({type:'video',blob:b}));
  return out;
}
/* 记录排序：有 sortOrder 用手动顺序，否则按上传时间倒序（新上传在最上方），旧记录退回按日期 */
function sortEntries(list){
  return list.slice().sort((a,b)=>{
    const ao=(a.sortOrder===undefined||a.sortOrder===null)?null:a.sortOrder;
    const bo=(b.sortOrder===undefined||b.sortOrder===null)?null:b.sortOrder;
    if(ao!==null&&bo!==null&&ao!==bo)return ao-bo;
    if(ao!==null&&bo===null)return -1;
    if(ao===null&&bo!==null)return 1;
    const at=a.createdAt||new Date(a.date+'T00:00:00').getTime()||0;
    const bt=b.createdAt||new Date(b.date+'T00:00:00').getTime()||0;
    return bt-at;
  });
}

  tl.querySelectorAll('[data-mv]').forEach(b=>b.onclick=async()=>{
    const e=entries.find(x=>x.id===b.dataset.id); if(!e)return;

    e.videos=m.filter(x=>x.type==='video').map(x=>x.blob);

  tl.querySelectorAll('[data-md]').forEach(b=>b.onclick=async()=>{

function drawChart(list){
  const c=$('#chart'),ctx=c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  if(list.length<2){ctx.fillStyle='#a89696';ctx.font='16px sans-serif';
    ctx.textAlign='center';ctx.fillText('至少需要两条数据才能绘制曲线',c.width/2,c.height/2);return}
  const P={l:56,r:16,t:20,b:40};
  const hs=list.filter(x=>x.height),ws=list.filter(x=>x.weight);
  const series=[];
  if(hs.length>1)series.push({data:hs,key:'height',color:'#f76a8c',label:'身高 cm'});
  if(ws.length>1)series.push({data:ws,key:'weight',color:'#4d96ff',label:'体重 kg',axis:1});
  const dates=[...new Set(list.map(x=>x.date))].sort();
  const xi=d=>P.l+(c.width-P.l-P.r)*(dates.indexOf(d)/(dates.length-1));
  const yMax=k=>Math.max(...list.map(x=>x[k]||0))*1.1;
  const draw=(s,ax)=>{
    const max=s.axis?yMax(s.key):Math.max(yMax('height'),yMax('weight'));
    const y=v=>c.height-P.b-(c.height-P.t-P.b)*(v/max);
    ctx.strokeStyle=s.color;ctx.lineWidth=2.5;ctx.beginPath();
    s.data.forEach((p,i)=>{const x=xi(p.date);i?ctx.lineTo(x,y(p[s.key])):ctx.moveTo(x,y(p[s.key]))});
    ctx.stroke();
    ctx.fillStyle=s.color;
    s.data.forEach(p=>{const x=xi(p.date);ctx.beginPath();ctx.arc(x,y(p[s.key]),4,0,7);ctx.fill()});
    // 轴标签
    ctx.font='12px sans-serif';ctx.textAlign='right';
    for(let i=1;i<=4;i++){const v=max*i/4;ctx.fillText(v.toFixed(s.key==='weight'?1:0),P.l-8,y(v));}
  };
  series.forEach(draw);
  // 日期轴
  ctx.fillStyle='#a89696';ctx.textAlign='center';
  dates.forEach((d,i)=>{ if(dates.length>8&&i%Math.ceil(dates.length/8)!==0)return;
    ctx.fillText(d.slice(5),xi(d),c.height-14);});
  // 图例
  let lx=P.l;ctx.textAlign='left';
  series.forEach(s=>{ctx.fillStyle=s.color;ctx.fillRect(lx,4,14,4);ctx.fillText(s.label,lx+18,12);lx+=ctx.measureText(s.label).width+50;});
}

async function addFiles(files){
  const arr=Array.from(files||[]);
  if(!arr.length)return;
  drop.textContent='处理中…';
  let ok=0,skipBig=0;
  for(const f of arr){
    const isImg=f.type.startsWith('image/');
    const isVid=f.type.startsWith('video/');
    if(!isImg&&!isVid)continue;
    if(isVid){
      if(f.size>VIDEO_MAX){skipBig++;continue}
      pendingPhotos.push({name:f.name,type:'video',blob:f});
      ok++;
    }else{
      const blob=await compress(f);
      pendingPhotos.push({name:f.name,type:'image',blob:blob||f});
      ok++;
    }
    renderThumbs();
  }
  drop.textContent='点击选择照片或视频，也可以拖到这里 📷🎬';
  if(skipBig)alert(`${skipBig} 个视频超过 80MB 已跳过，建议先在相册里压缩视频再上传`);
  if(!ok&&!skipBig)alert('没有可用的照片或视频');
}

function renderTrend(){
  renderGrowth();
  // 按天汇总母乳量（最近 14 天，无数据的天补 0）
  const byDay={};
  for(const f of feeds){const d=(f.ts||'').slice(0,10);if(d)byDay[d]=(byDay[d]||0)+(f.ml||0)}
  const days=[...new Set([...Object.keys(byDay)])].sort();
  let series=[];
  if(days.length){
    const start=new Date(days[0]+'T00:00:00'), end=new Date(days[days.length-1]+'T00:00:00');
    for(let t=new Date(start);t<=end;t.setDate(t.getDate()+1)){
      const k=localDateStr(t);
      series.push({day:k,ml:byDay[k]||0});
    }
    if(series.length>30)series=series.slice(-30);
  }
  // 摘要
  const last7=series.slice(-7), total7=last7.reduce((a,x)=>a+x.ml,0);
  const avg7=last7.length?(total7/last7.length).toFixed(0):0;
  const today=nowLocal().slice(0,10);
  const todayMl=byDay[today]||0;
  const best=series.length?series.reduce((a,b)=>b.ml>a.ml?b:a):null;
  $('#feedSummary').innerHTML=feeds.length?`
    <div class="stats" style="grid-template-columns:repeat(3,1fr);margin:0">

      <div class="stat"><b>${avg7}ml</b><span>近7天日均</span></div>

    </div>`
    :'<div class="empty" style="padding:16px 0"><span class="emoji">🍼</span>还没有吸乳记录，去「添加」页记一笔吧</div>';
  drawMilkChart(series);

  $('#feedAllList').innerHTML=all.length

     all.map(f=>{

         <span class="age-badge">${calcAge(baby&&baby.birth,d)}</span></span>

    if(confirm('删除这条吸乳记录？')){await dbDel('feeds',b.dataset.fdel);await loadAll();renderTrend()}
  });
}
function drawMilkChart(series){
  const c=$('#milkChart'),ctx=c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  if(series.length<2){ctx.fillStyle='#a89696';ctx.font='15px sans-serif';
    ctx.textAlign='center';
    ctx.fillText('至少需要两天数据才能绘制曲线（每天可记多次，自动按天合计）',c.width/2,c.height/2);return}
  const P={l:56,r:16,t:20,b:40}, W=c.width-P.l-P.r, H=c.height-P.t-P.b;
  const max=Math.max(...series.map(x=>x.ml),10)*1.15;
  const xi=i=>P.l+W*i/(series.length-1);
  const y=v=>c.height-P.b-H*v/max;
  // 网格与轴
  ctx.strokeStyle='#f5e3e6';ctx.lineWidth=1;ctx.textAlign='right';ctx.font='11px sans-serif';
  for(let g=0;g<=4;g++){
    const v=max*g/4, yy=y(v);
    ctx.beginPath();ctx.moveTo(P.l,yy);ctx.lineTo(c.width-P.r,yy);ctx.stroke();
    ctx.fillStyle='#a89696';ctx.fillText(Math.round(v),P.l-8,yy+4);
  }
  // 柱状（每日总量，浅色）
  const bw=Math.max(2,W/series.length*0.5);
  series.forEach((s,i)=>{
    ctx.fillStyle=s.ml?'#ffd6de':'#faf5f5';
    ctx.fillRect(xi(i)-bw/2,y(s.ml),bw,c.height-P.b-y(s.ml));
  });
  // 曲线
  ctx.strokeStyle='#ff8fab';ctx.lineWidth=2.5;ctx.beginPath();
  series.forEach((s,i)=>i?ctx.lineTo(xi(i),y(s.ml)):ctx.moveTo(xi(i),y(s.ml)));
  ctx.stroke();
  ctx.fillStyle='#f76a8c';
  series.forEach((s,i)=>{ctx.beginPath();ctx.arc(xi(i),y(s.ml),3.5,0,7);ctx.fill()});
  // 日期轴
  ctx.fillStyle='#a89696';ctx.font='11px sans-serif';ctx.textAlign='center';
  series.forEach((s,i)=>{
    if(series.length>10&&i%Math.ceil(series.length/10)!==0&&i!==series.length-1)return;
    ctx.fillText(s.day.slice(5),xi(i),c.height-14);
  });
  // 图例
  ctx.textAlign='left';
  ctx.fillStyle='#ffd6de';ctx.fillRect(P.l,4,12,12);
  ctx.fillStyle='#a89696';ctx.fillText('每日总量',P.l+16,14);
  ctx.fillStyle='#ff8fab';ctx.fillRect(P.l+86,8,14,3);
  ctx.fillText('趋势',P.l+104,14);
}

/* 排序模式开关 */
function syncReorderUI(){
  const b=$('#btnReorder');
  b.textContent=reorderMode?'✅ 完成排序':'↕️ 调整记录顺序';
  b.classList.toggle('btn-primary',reorderMode);
  b.classList.toggle('btn-ghost',!reorderMode);
  $('#btnResetOrder').hidden=!reorderMode;
  renderTimeline();
}
$('#btnReorder').onclick=()=>{reorderMode=!reorderMode;syncReorderUI()};
$('#btnResetOrder').onclick=async()=>{
  if(!confirm('恢复为按日期自动排序？手动调整的顺序会被清除。'))return;
  for(const e of entries){ delete e.sortOrder; await dbPut('entries',e); }
  reorderMode=false; await loadAll(); syncReorderUI();
};

/* ================= 编辑记录 ================= */
let editingId=null, editMedia=[];
function openEdit(id){
  const e=entries.find(x=>x.id===id); if(!e)return;
  editingId=id;
  $('#eTitle').value=e.title||'';
  $('#eDate').value=e.date||'';
  $('#eTag').innerHTML=document.querySelector('#fTag').innerHTML;
  $('#eTag').value=e.tag||'📷 照片';
  $('#eDesc').value=e.desc||'';
  editMedia=getMedia(e).map(m=>({type:m.type,blob:m.blob}));
  renderEditMedia();
  $('#editor').classList.remove('hidden');
}
function renderEditMedia(){
  $('#eMedia').innerHTML=editMedia.length?editMedia.map((m,i)=>{
    const url=URL.createObjectURL(m.blob);
    const inner=m.type==='video'
      ? `<video src="${url}" muted playsinline preload="metadata"></video><span class="vbadge">▶ 视频</span>`
      : `<img src="${url}" alt="">`;
    return `<div class="em">
      ${inner}
      <button data-edel="${i}" title="删除">✕</button>
      <span class="mv">
        <button data-emv="up" data-i="${i}" ${i===0?'style="opacity:.35"':''}>◀</button>
        <button data-emv="down" data-i="${i}" ${i===editMedia.length-1?'style="opacity:.35"':''}>▶</button>
      </span></div>`;
  }).join(''):'<div style="color:#a89696;font-size:.85rem;grid-column:1/-1">暂无照片或视频</div>';

  document.querySelectorAll('[data-edel]').forEach(b=>b.onclick=()=>{
    editMedia.splice(+b.dataset.edel,1);renderEditMedia();
  });
  document.querySelectorAll('[data-emv]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, j=b.dataset.emv==='up'?i-1:i+1;
    if(j<0||j>=editMedia.length)return;
    [editMedia[i],editMedia[j]]=[editMedia[j],editMedia[i]];
    renderEditMedia();
  });
}
$('#eAddBtn').onclick=()=>$('#eAddFile').click();
$('#eAddFile').onchange=async e=>{
  const arr=Array.from(e.target.files||[]);
  $('#eAddFile').value='';
  let skipBig=0;
  for(const f of arr){
    const isImg=f.type.startsWith('image/'), isVid=f.type.startsWith('video/');
    if(!isImg&&!isVid)continue;
    if(isVid){
      if(f.size>VIDEO_MAX){skipBig++;continue}
      editMedia.push({type:'video',blob:f});
    }else{
      editMedia.push({type:'image',blob:(await compress(f))||f});
    }
    renderEditMedia();
  }
  if(skipBig)alert(`${skipBig} 个视频超过 80MB 已跳过`);
};
$('#eCancel').onclick=()=>{$('#editor').classList.add('hidden');editingId=null};
$('#editor').onclick=e=>{
  if(e.target.id==='editor'){$('#editor').classList.add('hidden');editingId=null}
};
$('#eSave').onclick=async()=>{
  const e=entries.find(x=>x.id===editingId); if(!e)return;
  const date=$('#eDate').value;
  if(!date){alert('请选择日期');return}
  e.title=$('#eTitle').value.trim();
  e.date=date;
  e.tag=$('#eTag').value;
  e.desc=$('#eDesc').value.trim();
  e.media=editMedia.map(m=>({type:m.type,blob:m.blob}));
  e.photos=editMedia.filter(m=>m.type==='image').map(m=>m.blob);
  e.videos=editMedia.filter(m=>m.type==='video').map(m=>m.blob);
  await dbPut('entries',e);
  $('#editor').classList.add('hidden');editingId=null;
  renderHome();renderTimeline();
  alert('✅ 修改已保存');
};
$('#viewer').onclick=e=>{
  if(e.target.tagName==='VIDEO')return;
  $('#viewer').classList.add('hidden');$('#viewerVid').pause();
};
// 设置
$('#btnBaby').onclick=()=>{
  baby={name:$('#sName').value.trim(),birth:$('#sBirth').value,emoji:$('#sEmoji').value};
  localStorage.setItem('baby',JSON.stringify(baby));
  renderHome();alert('✅ 宝宝信息已保存');
};
// 备份
$('#btnExport').onclick=async()=>{
  const pack=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});
  const es=await dbAll('entries'),gs=await dbAll('growth'),fs=await dbAll('feeds');
  for(const e of es){
    e.photos=await Promise.all((e.photos||[]).map(pack));
    e.videos=await Promise.all((e.videos||[]).map(pack));
  }
  const data=JSON.stringify({v:2,baby,entries:es,growth:gs,feeds:fs});
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`宝宝相册备份-${localDateStr()}.json`;a.click();
};
$('#btnImport').onclick=()=>$('#fImport').click();
$('#fImport').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    if(!data.entries)throw 0;
    if(!confirm('导入将合并到现有数据中，继续吗？'))return;
    const unb64=s=>fetch(s).then(r=>r.blob());
    for(const en of data.entries){
      en.id=en.id||uid();
      en.photos=await Promise.all((en.photos||[]).map(unb64));
      en.videos=await Promise.all((en.videos||[]).map(unb64));
      await dbPut('entries',en);
    }
    for(const g of (data.growth||[])){g.id=g.id||uid();await dbPut('growth',g)}
    for(const f of (data.feeds||[])){f.id=f.id||uid();await dbPut('feeds',f)}
    if(data.baby){baby=data.baby;localStorage.setItem('baby',JSON.stringify(baby))}
    await loadAll();alert('✅ 导入完成');
  }catch{alert('备份文件格式不正确')}
  e.target.value='';
};
$('#btnWipe').onclick=async()=>{
  if(!confirm('确定清空所有数据吗？此操作不可恢复！'))return;
  if(!confirm('再次确认：照片将全部删除，建议先导出备份。'))return;
  await dbClear('entries');await dbClear('growth');await dbClear('feeds');
  localStorage.removeItem('baby');baby=null;await loadAll();alert('已清空');
};

/* ================= PWA ================= */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;$('#btnInstall').hidden=false;
});
$('#btnInstall').onclick=async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  const{outcome}=await deferredPrompt.userChoice;
  if(outcome==='accepted'){$('#btnInstall').hidden=true;alert('已安装！可以在主屏幕找到「宝宝相册」了 🎉')}
  deferredPrompt=null;
};
window.addEventListener('appinstalled',()=>{$('#btnInstall').hidden=true});
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

(async()=>{

  if(baby){$('#sName').value=baby.name||'';$('#sBirth').value=baby.birth||'';$('#sEmoji').value=baby.emoji||'👶'}

})();
